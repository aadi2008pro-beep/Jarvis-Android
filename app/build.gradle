plugins {
	    id 'com.android.application'
	        id 'kotlin-android'
	        }

	        android {
	        	    compileSdk 34

	        	        defaultConfig {
	        	        	        applicationId "com.jarvis.app"
	        	        	                minSdk 24
	        	        	                        targetSdk 34
	        	        	                                versionCode 1
	        	        	                                        versionName "1.0"
	        	        	                                            }
	        	        	                                            }

	        	        	                                            dependencies {
	        	        	                                            	    implementation 'androidx.core:core-ktx:1.12.0'
	        	        	                                            	        // Networking library for AI communication
	        	        	                                            	            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	        	        	                                            	            }
	        	        	                                            	            
	        	        	                                            }
	        	        }
	        }
}
